version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  postgres_data:
